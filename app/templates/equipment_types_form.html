{% extends "layout_dashboard.html" %}

{% block content %}
<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .form-input {
        background: rgba(248, 250, 252, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.8);
        transition: all 0.3s ease;
    }

    .form-input:focus {
        background: white;
        border-color: #8b5cf6;
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        outline: none;
    }

    .btn-premium {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        transition: all 0.3s ease;
    }

    .btn-premium:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
    }
</style>

<div class="max-w-3xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
    <!-- Header Section -->
    <div class="text-center">
        <h2 class="text-3xl font-black text-slate-800 tracking-tight">{{ title }}</h2>
        <p class="text-sm text-slate-500 font-medium italic mt-2">Configure system classification parameters.</p>
    </div>

    <div class="glass-card rounded-[2.5rem] p-10 relative overflow-hidden">
        <div class="absolute -right-4 -top-4 bg-primary-500/10 w-24 h-24 rounded-full blur-3xl"></div>

        {% if error %}
        <div class="mb-8 p-4 bg-rose-50 border border-rose-100 rounded-2xl flex items-center gap-3 text-rose-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd" />
            </svg>
            <span class="text-xs font-bold uppercase tracking-tight">{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" class="space-y-8">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Category
                    Classification Name</label>
                <div class="relative">
                    <input type="text" name="name" value="{{ type.name if type else (name if name else '') }}" required
                        placeholder="e.g. Precision Cooling Unit"
                        class="form-input w-full rounded-2xl px-6 py-4 text-slate-700 font-bold placeholder:text-slate-300">
                    <div class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between pt-4">
                <a href="/equipment_types/"
                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-slate-600 transition-colors">
                    &larr; Abort & Return
                </a>
                <button type="submit"
                    class="btn-premium text-white px-10 py-4 rounded-2xl font-black text-sm tracking-tight">
                    {{ 'Commit Changes' if type else 'Finalize Registration' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
