<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manual | DI Platform</title>
    <script src="/static/js/tailwind.js"></script>
    <style>
        body {
            background: #020617;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }

        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            color: #f8fafc;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1rem;
        }

        .markdown-content h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            color: #8b5cf6;
        }

        .markdown-content h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #c084fc;
        }

        .markdown-content p {
            margin-bottom: 1.25rem;
            line-height: 1.75;
            color: #94a3b8;
        }

        .markdown-content ul {
            list-style: disc;
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
            color: #94a3b8;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }

        .markdown-content img {
            border-radius: 1rem;
            border: 1px solid #1e293b;
            margin: 2rem 0;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            width: 100%;
            transition: transform 0.3s ease;
        }

        .markdown-content img:hover {
            transform: scale(1.02);
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #1e293b;
            margin: 4rem 0;
        }

        .markdown-content a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .markdown-content a:hover {
            color: #a78bfa;
        }
    </style>
</head>

<body class="p-4 md:p-12">
    <div class="max-w-4xl mx-auto">
        <a href="javascript:history.back()"
            class="inline-flex items-center text-slate-400 hover:text-white mb-8 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Dashboard
        </a>
        <div class="markdown-content">
            {{ content | safe }}
        </div>
        <footer class="mt-20 pt-8 border-t border-slate-800 text-center text-slate-500 text-sm pb-12">
            &copy; 2025 DC Intelligence Platform Protocol. All Rights Reserved.
        </footer>
    </div>
</body>

</html>
