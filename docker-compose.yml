version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: di_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-di_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-di_password}
      POSTGRES_DB: ${POSTGRES_DB:-di_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-di_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - di_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: di_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - di_network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: di_app
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-di_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-di_password}
      POSTGRES_DB: ${POSTGRES_DB:-di_database}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}

      # Application
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-False}
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/static/profile_pics:/app/app/static/profile_pics
    networks:
      - di_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:


networks:
  di_network:
    driver: bridge
